name: Release packaging gate

# Public packaging requires an approved source for redistributable API and
# Unity compile references. Local game references must never reach public CI.
# This workflow deliberately publishes nothing until that prerequisite is met.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-source-required:
    runs-on: ubuntu-latest
    steps:
      - name: Report packaging prerequisite
        run: |
          echo '::error::Release packaging is unavailable: approved redistributable compile-reference sourcing is required. Use the documented local build for validation; do not upload game references.'
          exit 1
