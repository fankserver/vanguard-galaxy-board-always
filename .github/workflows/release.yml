name: Package release

# Compile references are redistributable: BepInEx and UnityEngine.Modules come from
# NuGet and the API contract from its public repository. Local game references are
# never uploaded or required here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    if: github.event_name != 'release' || !contains(github.event.release.assets.*.name, 'update.json')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Checkout public API contracts
        uses: actions/checkout@v7
        with:
          repository: fankserver/vanguard-galaxy-api
          ref: c74893332ea2370f84d0b1b0c719039f48401e89
          path: .api
      - name: Build and test
        run: |
          dotnet build .api/VGModAPI.Abstractions/VGModAPI.Abstractions.csproj -c Release --nologo
          make test CONFIG=Release API_ABSTRACTIONS="$PWD/.api/VGModAPI.Abstractions/bin/Release/netstandard2.1/VGModAPI.Abstractions.dll"
      - name: Package and validate metadata
        run: |
          (cd tools && python3 -m unittest test_package)
          python3 tools/package.py --tag "$TAG"
      - name: Upload immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/*.zip
          gh release upload "$TAG" dist/update.json
